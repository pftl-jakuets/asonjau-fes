<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あそんじゃうフェス in 大和郡山</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
    <div class="container hero-inner">
        <span class="badge">
            未来の子育て環境を考える社会実験
        </span>
        <h1>
            あそんじゃうフェス<br>
            in 大和郡山
        </h1>
        <p>
            遊びながら、未来をつくろう。
        </p>
        <a href="#entry" class="btn">
            参加申し込み
        </a>
    </div>
</header>
<section class="concept">
    <div class="container">
        <h2>このイベントについて</h2>
        <p class="section-text">
            大和郡山市では、新しい子ども・子育て支援環境づくりに向けた
            社会実験を実施します。
        </p>
    </div>
</section>
<section>
    <div class="container">
        <h2>あそびコンテンツ</h2>
        <div class="cards">
            <div class="card">
                <img
                    src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=800&q=80">
                <div class="card-content">
                    <h3>トントン相撲</h3>
                    <p>
                        親子で気軽に楽しめる人気コンテンツ。
                    </p>
                </div>
            </div>
            <!-- 以下カード追加 -->
        </div>
    </div>
</section>
<section id="entry" class="cta">
    <div class="container">
        <h2>参加申し込み</h2>
        <p>
            定員になり次第受付終了となります。
        </p>
        <a
            href="https://forms.google.com"
            target="_blank"
            class="btn">
            申し込む
        </a>
    </div>
</section>
<footer>
    <p>
        © あそんじゃうフェス in 大和郡山
    </p>
</footer>

</body>
</html>
